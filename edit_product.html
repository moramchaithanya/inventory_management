<!DOCTYPE html>
<html>
<head>
<title>Edit Product</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="form-box">

<h2>Edit Product</h2>

<form method="POST">

<input type="text"
name="name"
value="{{product.name}}">

<input type="number"
name="quantity"
value="{{product.quantity}}">

<input type="number"
step="0.01"
name="price"
value="{{product.price}}">

<button type="submit">
Update Product
</button>

</form>

</div>

</body>
</html>
