<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="form-box">

<h2>Add Product</h2>

<form method="POST">

<input
type="text"
name="name"
placeholder="Product Name"
required>

<input
type="number"
name="quantity"
placeholder="Quantity"
required>

<input
type="number"
step="0.01"
name="price"
placeholder="Price"
required>

<button type="submit">
Save Product
</button>

</form>

</div>

</body>
</html>
